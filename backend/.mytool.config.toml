# Venture 文件回退系统配置模板
# 路径：<app_private>/.mytool/config.toml
# 此文件由后端自动生成和管理，手动编辑后需重启后端生效。

# ─── 备份模式 ───────────────────────────────────────────────────────────────
# snapshot: 强制全量备份（CC 模式），回退时整文件覆盖
# hunks:    行级差分追踪（Grok 模式），支持选择性接受/拒绝 hunk
# auto:     根据文件大小、修改频率自动选择策略

[backup]
default_mode = "snapshot"

# ─── 配额管理 ───────────────────────────────────────────────────────────────

[backup.quota]
# 本地存储最大空间（字节）
max_total_size = 524288000        # 500MB
# SAF 工作区最大空间（Android 私有目录配额受限）
saf_max_total_size = 209715200    # 200MB
# 达到此比例时发出警告（0.0-1.0）
warn_threshold = 0.8
# 清理策略：lru（最近最少使用）| oldest_session（最旧会话）
cleanup_policy = "lru"

# ─── Phase 2 阈值配置 ───────────────────────────────────────────────────────
# Phase 2 启用后影响 Auto 模式的存储决策

[backup.thresholds]
# 小于此阈值 → 全量备份（成本可忽略）
small_file_threshold = 262144     # 256KB
# 大于此阈值 → UnrecoverableHashOnly（不可精确回退）
large_file_threshold = 52428800   # 50MB
# Delta 压缩后小于 post 的此比例 → 使用 Delta 编码
delta_ratio_threshold = 0.7
# 同一文件本次会话修改次数达到此值 → 使用 Delta 编码
high_frequency_writes = 3
# 外部编辑历史是否惩罚 Delta（强制使用 FullManifest）
external_edit_penalty = true

# ─── 锚点机制（Phase 2）──────────────────────────────────────────────────────
# Delta 链过长时定期插入 FullManifest 锚点，避免长链累积误差

[backup.anchors]
# Delta 链最大长度，超过则插入锚点
max_hunk_chain_length = 20
# 自动锚点间隔（分钟）
auto_anchor_interval_minutes = 10

# ─── WAL 配置 ───────────────────────────────────────────────────────────────

[wal]
# WAL intent 文件目录（相对于 .mytool/）
dir = "journal/wal"
# 启动时是否自动执行 WAL 恢复
auto_recover_on_startup = true

# ─── 路径级策略覆写 ─────────────────────────────────────────────────────────
# 对不同目录/glob 应用不同策略，优先级：path 覆写 > 全局设置 > 默认

[[backup.path_overrides]]
glob_pattern = "*.lock"
mode = "snapshot"

[[backup.path_overrides]]
glob_pattern = "*.min.js"
mode = "snapshot"

[[backup.path_overrides]]
glob_pattern = "src/**"
mode = "hunks"

# ─── SAF 代理配置（Android 环境）─────────────────────────────────────────────

[saf]
# 是否启用 SAF 模式（桌面环境为 false）
enabled = false
# SAF 工作区根 URI（Android SAF 授权 URI）
# saf_root_uri = "content://com.android.externalstorage.documents/tree/primary%3AVenture"
# 私有目录中的 work_copy 路径
work_copy_dir = "work_copy"
